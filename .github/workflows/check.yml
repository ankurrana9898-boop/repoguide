name: Check prototype
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/core.test.cjs
      - run: node --check docs/core.js
      - run: node --check docs/app.js
